name: Rust Build

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: ""
      snapshot:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  GORELEASER_CURRENT_TAG: ${{ inputs.version && format('v{0}', inputs.version) || '' }}

jobs:
  linux-windows:
    name: Build Linux and Windows
    runs-on: ubuntu-latest
    env:
      BUILD_PLATFORM: linux-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true

      - name: Read release metadata
        run: node scripts/release-metadata.js

      - name: Install mingw-w64
        if: env.RELEASE_BINARIES != '[]'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Set up Zig
        if: env.RELEASE_BINARIES != '[]'
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: env.RELEASE_BINARIES != '[]'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Ensure build script is executable
        if: env.RELEASE_BINARIES != '[]'
        run: chmod +x scripts/cargo-or-zigbuild.js

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Package archives
        run: ${{ inputs.snapshot && 'make release-snapshot' || 'make release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-linux-windows-builds
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: ${{ inputs.snapshot && 7 || 30 }}

  macos:
    name: Build macOS
    runs-on: macos-latest
    env:
      BUILD_PLATFORM: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true

      - name: Read release metadata
        run: node scripts/release-metadata.js

      - name: Install GoReleaser
        if: env.RELEASE_BINARIES != '[]'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Package archives
        if: env.RELEASE_BINARIES != '[]'
        run: ${{ inputs.snapshot && 'make release-snapshot' || 'make release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: env.RELEASE_BINARIES != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-macos-builds
          path: dist/*_darwin_*.tar.gz
          retention-days: ${{ inputs.snapshot && 7 || 30 }}
