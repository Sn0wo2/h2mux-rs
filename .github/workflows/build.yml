name: Rust Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
      version:
        type: string
      snapshot:
        type: boolean
        default: true

permissions:
  contents: read

env:
  GORELEASER_CURRENT_TAG: ${{ inputs.version && format('v{0}', inputs.version) }}

jobs:
  build:
    name: Package source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        if: ${{ !inputs.snapshot }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Sync workspace version
        if: ${{ !inputs.snapshot }}
        run: cargo set-version --workspace "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Package archive
        run: ${{ inputs.snapshot && 'make release-snapshot' || 'make release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-source-builds
          path: dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.snapshot && 7 || 30 }}
