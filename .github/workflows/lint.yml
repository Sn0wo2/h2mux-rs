name: Rust Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check Rust
    runs-on: ubuntu-latest
    outputs:
      autofix: ${{ steps.patch.outputs.changed }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - &rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Apply Rust lint fixes
        id: fix
        continue-on-error: true
        run: make lint-fix
      - name: Check remaining Rust lint
        run: make fmt lint
      - name: Save lint fixes
        id: patch
        if: ${{ !cancelled() && steps.fix.conclusion == 'success' }}
        run: |
          if ! git diff --quiet -- '*.rs'; then
            git diff --binary -- '*.rs' > "$RUNNER_TEMP/lint-fixes.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git restore --worktree -- '*.rs'
          fi
      - name: Upload lint fixes
        if: ${{ !cancelled() && steps.patch.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-fixes
          path: ${{ runner.temp }}/lint-fixes.patch
          retention-days: 7
          if-no-files-found: error
      - name: Check feature configurations and documentation
        run: make check check-no-default doc

  autofix:
    needs: check
    if: >-
      !cancelled() && needs.check.outputs.autofix == 'true' && github.ref_type == 'branch' &&
      (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
    name: Auto-fix Rust lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - name: Download lint fixes
        uses: actions/download-artifact@v8
        with:
          name: lint-fixes
          path: ${{ runner.temp }}/lint-fixes
      - name: Apply lint fixes
        run: git apply "$RUNNER_TEMP/lint-fixes/lint-fixes.patch"
      - name: Open auto-fix pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: auto-fix Rust formatting and lint"
          branch: auto-fix/rust-${{ github.event.pull_request.number || github.ref_name }}
          base: ${{ github.event.pull_request.head.ref || github.ref_name }}
          delete-branch: true
          title: "chore: auto-fix Rust formatting and lint"
          body: "Automated rustfmt and Clippy fixes from CI. Unfixable lint issues remain blocking."
          labels: automated,rust

  dependencies:
    name: Check dependency security
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - &rust-stable
        name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - *rust-cache
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run dependency security checks
        run: make security

  geiger:
    name: Check unsafe Rust with Geiger
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - *checkout
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - *rust-cache
      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: Run Cargo Geiger
        run: cargo +nightly geiger --all-features --output-format GitHubMarkdown > geiger-report.md 2>&1 || true
      - name: Upload Geiger report
        uses: actions/upload-artifact@v7
        with:
          name: geiger-report-${{ github.sha }}
          path: geiger-report.md
          retention-days: 30
      - name: Add Geiger report to job summary
        run: cat geiger-report.md >> "$GITHUB_STEP_SUMMARY"
  semver:
    name: Check semantic versioning
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - *rust-stable
      - *rust-cache
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check release compatibility
        run: cargo semver-checks check-release --all-features
