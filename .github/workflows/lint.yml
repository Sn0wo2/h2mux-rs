name: Rust Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          [lint, doc, check, check-all-features, check-no-default]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true
      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}

  dependencies:
    name: Check dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run dependency security checks
        run: make security

  geiger:
    name: Check unsafe Rust with Geiger
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache Geiger data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-geiger
          cache-on-failure: true
      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: Run Cargo Geiger
        run: cargo +nightly geiger --all-features --output-format GitHubMarkdown > geiger-report.md 2>&1 || true
      - name: Upload Geiger report
        uses: actions/upload-artifact@v7
        with:
          name: geiger-report-${{ github.sha }}
          path: geiger-report.md
          retention-days: 30
      - name: Add Geiger report to job summary
        run: cat geiger-report.md >> "$GITHUB_STEP_SUMMARY"
  semver:
    name: Check semantic versioning
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check release compatibility
        run: cargo semver-checks check-release --all-features
