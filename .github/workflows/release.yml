name: Rust Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.1)"
        required: true
        type: string
      snapshot:
        description: "Snapshot mode (no bump, no tag, no publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
      has_publishable_crates: ${{ steps.metadata.outputs.has_publishable_crates }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'push' || inputs.snapshot == true) && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event.repository.name }}-cargo
          cache-on-failure: true

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit,cargo-deny

      - name: Update manual release base
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.snapshot }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git checkout --detach FETCH_HEAD

      - name: Normalize version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: node scripts/release.js normalize-version

      - name: Refuse existing release tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.snapshot }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

      - name: Bump version
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.snapshot }}
        run: cargo set-version --workspace "$VERSION"

      - name: Verify workspace versions and publishable crates
        id: metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERIFY_VERSION: ${{ github.event_name == 'push' || !inputs.snapshot }}
        run: node scripts/release.js verify-metadata

      - name: Run gated checks
        run: make ci

      - name: Commit version bump
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.snapshot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(release): bump version to $VERSION"

      - name: Push version commit and tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.snapshot }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git tag "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "HEAD:refs/tags/v$VERSION"

      - name: Record release commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build artifacts
    permissions:
      contents: read
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      snapshot: ${{ inputs.snapshot == true }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    if: ${{ !inputs.snapshot }}
    needs: [prepare, build]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ github.event.repository.name }}-*-builds
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: node scripts/release.js generate-checksums

      - name: Verify crates.io credentials
        if: ${{ needs.prepare.outputs.has_publishable_crates == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.js create-release

      - name: Publish to crates.io
        if: ${{ needs.prepare.outputs.has_publishable_crates == 'true' }}
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --allow-dirty
