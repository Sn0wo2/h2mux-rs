name: Rust Auto-fix

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch')
    name: Auto-fix Rust lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Apply Rust lint fixes
        run: make lint-fix

      - name: Open auto-fix pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-fix Rust formatting and lint"
          branch: auto-fix/rust-${{ github.event.pull_request.number || github.ref_name }}
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          delete-branch: true
          title: "chore: auto-fix Rust formatting and lint"
          body: "Automated rustfmt and Clippy fixes. Strict CI checks remain required on the source branch."
          labels: automated,rust
