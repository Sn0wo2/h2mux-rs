[package]
name = "h2mux-rs"
description = "HTTP/2 multiplexed stream protocol"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Sn0wo2/h2mux-rs"

[dependencies]
bytes = "1"
futures-util = "0.3"
h2 = "0.4.20"
http = "1"
tokio = { version = "1", features = ["io-util"] }
tracing = "0.1"
